name: Deploy to EC2

# Triggered by push to main, or manually via "Run workflow" button in GitHub UI.
# Skips deploys for commits that only touch docs (README, DEPLOY.md, .github).
#
# Tests run first; deploy only runs if tests pass. The test step also fires
# on every PR to main so issues surface before merge.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
      - 'GITHUB.md'
      - '*.md'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Don't run multiple deploys at once
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        # CI install — matches package-lock.json exactly.
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    # Only deploy on push to main, never on PRs (PRs run tests but don't deploy).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          REPO_PATH: ${{ secrets.REPO_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -se <<EOF
            set -euo pipefail
            cd "$REPO_PATH"

            echo "▸ Fetching from origin..."
            git fetch --quiet origin main

            BEFORE=\$(git rev-parse HEAD)
            AFTER=\$(git rev-parse origin/main)

            if [ "\$BEFORE" = "\$AFTER" ]; then
              echo "✓ Already up to date (\$BEFORE)"
              exit 0
            fi

            echo "▸ Updating \$BEFORE → \$AFTER"

            # Take the deploy lock — wait up to 2 minutes for any active cron job
            # (daily scrape, weekly digest, S3 backup) to finish before swapping
            # files underneath it. This prevents the rare-but-ugly case where the
            # cron job's process loads modules from the new code mid-run, or
            # writes a partially-rewritten data file.
            (
              /usr/bin/flock -w 120 9 || { echo "✗ Could not acquire deploy lock within 120s"; exit 1; }

              echo "  ✓ deploy lock acquired"
              git reset --hard origin/main

              # Cache-busting: stamp the current commit SHA into HTML files so
              # browsers fetch fresh JS/CSS on every deploy. The placeholder
              # comes back fresh on each \`git reset --hard\` above.
              COMMIT_SHA=\$(git rev-parse --short HEAD)
              find public -name "*.html" -exec sed -i "s/__CACHE_VERSION__/\$COMMIT_SHA/g" {} \;
              # Stamp the same SHA into bare local JS imports (e.g. \`from './documents.js'\`)
              # so transitive ES module imports also bust caches. Idempotent: rewrites any
              # existing \`?v=...\` query to the new SHA.
              find public -name "*.js" -exec sed -i "s|from '\(\./[^'?]*\.js\)[^']*'|from '\1?v=\$COMMIT_SHA'|g" {} \;

              # Reinstall deps if package.json changed
              if git diff --name-only "\$BEFORE" "\$AFTER" | grep -qE '^(package(-lock)?\.json)$'; then
                echo "▸ package.json changed, running npm install..."
                npm install --production
              fi

              # If setup.sh changed, warn but don't auto-run (could break things)
              if git diff --name-only "\$BEFORE" "\$AFTER" | grep -q '^setup\.sh$'; then
                echo "! setup.sh changed — review and run manually if needed"
              fi

              # Remove stale lawbound cron block left behind by pre-rename deploys.
              # setup.sh only manages the anyajob block, so without this the two
              # blocks coexist and every job fires twice (root cause of the
              # 2026-05-06 feedback.json corruption from concurrent daily.js runs).
              echo "▸ Checking crontab for stale lawbound block..."
              if crontab -l 2>/dev/null | grep -qF '>>> lawbound managed entries >>>'; then
                crontab -l 2>/dev/null \
                  | sed '/>>> lawbound managed entries >>>/,/<<< lawbound managed entries <<</d' \
                  | crontab -
                echo "  ✓ removed stale lawbound block"
              else
                echo "  (no stale lawbound block found)"
              fi
              DAILY_COUNT=\$(crontab -l 2>/dev/null | grep -c 'daily\.js' || true)
              echo "  daily.js cron entries: \$DAILY_COUNT (expected: 1)"
              if [ "\$DAILY_COUNT" != "1" ]; then
                echo "! warning: unexpected daily.js entry count — inspect with 'crontab -l'"
              fi

              echo "▸ Restarting service..."
              sudo systemctl restart anyajob
            ) 9>/tmp/anyajob.lock

            sleep 2
            if systemctl is-active --quiet anyajob; then
              echo "✓ Service is running"
            else
              echo "✗ Service failed to start — check journalctl -u anyajob"
              exit 1
            fi
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

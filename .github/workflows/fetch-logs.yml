name: Fetch service logs

# Manual-only diagnostic job — SSHes to EC2 and prints recent anyajob logs
# matching parse/resume/error/fail/500. Mirrors deploy.yml SSH setup.

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tail anyajob logs
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          REPO_PATH: ${{ secrets.REPO_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" REPO_PATH="$REPO_PATH" bash -se <<'EOF'
            set -uo pipefail

            echo "===== deployed commit ====="
            if [ -n "${REPO_PATH:-}" ] && [ -d "${REPO_PATH:-}" ]; then
              git -C "$REPO_PATH" log -1 --format='%H %s%n%ad' --date=iso || true
            else
              echo "(REPO_PATH not set or not a directory: '${REPO_PATH:-<empty>}')"
            fi

            echo
            echo "===== service status ====="
            systemctl status anyajob --no-pager --lines=5 || true

            echo
            echo "===== filtered log lines (last 24h, parse/resume/score/error/fail/500) ====="
            sudo journalctl -u anyajob --since "24 hours ago" --no-pager \
              | grep -i -E "parse|resume|score|error|fail|500" \
              | tail -200 || echo "(no matching lines)"

            echo
            echo "===== upload-route lines (last 24h) ====="
            sudo journalctl -u anyajob --since "24 hours ago" --no-pager \
              | grep -E "POST /api/(documents|profile)" \
              | tail -50 || echo "(no upload requests)"

            echo
            echo "===== last 60 raw lines ====="
            sudo journalctl -u anyajob --since "2 hours ago" --no-pager | tail -60 || true

            echo
            echo "===== persisted parse-failed entries in documents.json ====="
            if [ -n "${REPO_PATH:-}" ] && [ -f "$REPO_PATH/data/documents.json" ]; then
              # Find any fingerprints whose resume.current.alignmentScore.error is set
              jq 'to_entries
                  | map({fp:.key,
                         file:.value.resume.current.file,
                         uploadedAt:.value.resume.current.uploadedAt,
                         alignmentError:.value.resume.current.alignmentScore.error,
                         alignmentRawSnippet:(.value.resume.current.alignmentScore.raw // "" | tostring | .[0:300]),
                         scoredAt:.value.resume.current.alignmentScore._scoredAt})
                  | map(select(.alignmentError))' \
                  "$REPO_PATH/data/documents.json" 2>/dev/null | head -200 \
                  || echo "(jq failed)"
              echo
              echo "--- counts:"
              jq '[to_entries[]
                   | select(.value.resume.current.alignmentScore.error)] | length as $errs
                  | [to_entries[]
                   | select(.value.resume.current.alignmentScore)] | length as $total
                  | "errors: \(.) / total scored: \($total)"' "$REPO_PATH/data/documents.json" 2>/dev/null || true
            else
              echo "(documents.json not found)"
            fi

            echo
            echo "===== last 100 unfiltered lines from journalctl ====="
            sudo journalctl -u anyajob --since "1 hour ago" --no-pager | tail -100 || true

            echo
            echo "===== nginx/reverse proxy access for /api/documents (last 24h) ====="
            for f in /var/log/nginx/access.log /var/log/nginx/anyajob.access.log; do
              if [ -f "\$f" ]; then
                echo "--- \$f"
                sudo grep -E "POST /api/documents/[^ ]+/(upload|score-resume)" "\$f" | tail -30 || true
              fi
            done

            echo
            echo "===== file mtimes in data/documents/_profile ====="
            if [ -n "${REPO_PATH:-}" ] && [ -d "$REPO_PATH/data/documents/_profile" ]; then
              ls -lat "$REPO_PATH/data/documents/_profile" | head -20
            fi
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

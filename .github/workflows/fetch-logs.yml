name: Fetch service logs

# Manual-only diagnostic job — SSHes to EC2 and prints recent anyajob logs
# matching parse/resume/error/fail/500. Mirrors deploy.yml SSH setup.

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tail anyajob logs
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          REPO_PATH: ${{ secrets.REPO_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" REPO_PATH="$REPO_PATH" bash -se <<'EOF'
            set -uo pipefail

            echo "===== deployed commit ====="
            if [ -n "${REPO_PATH:-}" ] && [ -d "${REPO_PATH:-}" ]; then
              git -C "$REPO_PATH" log -1 --format='%H %s%n%ad' --date=iso || true
            else
              echo "(REPO_PATH not set or not a directory: '${REPO_PATH:-<empty>}')"
            fi

            echo
            echo "===== service status ====="
            systemctl status anyajob --no-pager --lines=5 || true

            echo
            echo "===== filtered log lines (last 24h, parse/resume/score/error/fail/500) ====="
            sudo journalctl -u anyajob --since "24 hours ago" --no-pager \
              | grep -i -E "parse|resume|score|error|fail|500" \
              | tail -200 || echo "(no matching lines)"

            echo
            echo "===== upload-route lines (last 24h) ====="
            sudo journalctl -u anyajob --since "24 hours ago" --no-pager \
              | grep -E "POST /api/(documents|profile)" \
              | tail -50 || echo "(no upload requests)"

            echo
            echo "===== last 60 raw lines ====="
            sudo journalctl -u anyajob --since "2 hours ago" --no-pager | tail -60 || true

            echo
            echo "===== documents.json profile resume entry ====="
            if [ -n "${REPO_PATH:-}" ] && [ -f "$REPO_PATH/data/documents.json" ]; then
              jq '._profile // {}' "$REPO_PATH/data/documents.json" 2>/dev/null | head -100 || echo "(jq failed)"
            else
              echo "(documents.json not found)"
            fi
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

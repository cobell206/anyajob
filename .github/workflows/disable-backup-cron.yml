name: Disable S3-backup cron (one-shot)

# Removes the nightly scripts/backup.js cron from the EC2 crontab. Redundant
# now that state lives in S3 with bucket versioning (and it errors — the
# instance role has no access to the old backup bucket). setup.sh no longer
# installs it. See SERVERLESS-TRANSITION.md.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Remove backup cron line
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -se <<'EOF'
            set -uo pipefail
            echo "=== crontab before ==="
            crontab -l 2>/dev/null | grep -nE "daily.js|weekly.js|discover.js|backup.js" || echo "(no managed jobs found)"
            crontab -l 2>/dev/null \
              | grep -v 'scripts/backup.js' \
              | grep -v 'Nightly S3 backup' \
              | crontab -
            echo "=== crontab after (backup.js should be gone; others remain) ==="
            crontab -l 2>/dev/null | grep -nE "daily.js|weekly.js|discover.js|backup.js" || echo "(none)"
            if crontab -l 2>/dev/null | grep -q 'scripts/backup.js'; then
              echo "FAIL: backup cron still present"; exit 1
            fi
            echo "OK: backup cron removed"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

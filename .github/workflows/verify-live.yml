name: Verify live app (backend + read/write)

# Proof that production is actually serving from the S3 backend. Reads the
# RUNNING server process's env (not just .env) and hits its local API.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Probe live process
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -se <<'EOF'
            set -uo pipefail
            PID=$(pgrep -f 'src/server.js' | head -1 || true)
            echo "server pid: ${PID:-none}"
            [ -n "${PID:-}" ] || { echo "FAIL: no server process"; exit 1; }

            echo "=== running process env (storage-related) ==="
            ENVV=$(tr '\0' '\n' < "/proc/$PID/environ")
            echo "$ENVV" | grep -E '^(STORAGE|S3_BUCKET|DOCS_BUCKET|AWS_REGION|PORT)=' || echo "(none set)"
            STORAGE_VAL=$(echo "$ENVV" | grep '^STORAGE=' | cut -d= -f2 || true)
            PORT=$(echo "$ENVV" | grep '^PORT=' | cut -d= -f2 || true); PORT=${PORT:-3000}

            echo "=== live API read (served from S3) ==="
            RESP=$(curl -s "http://localhost:$PORT/api/listings" || true)
            COUNT=$(printf '%s' "$RESP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).count)}catch{console.log('ERR')}})")
            echo "listings count served: $COUNT"

            echo "=== instance role (IMDS) ==="
            ROLE=$(curl -s --max-time 3 http://169.254.169.254/latest/meta-data/iam/security-credentials/ || true)
            echo "instance role: ${ROLE:-none}"

            echo "=== assertions ==="
            [ "$STORAGE_VAL" = "s3" ] || { echo "FAIL: live process not on s3 (STORAGE=$STORAGE_VAL)"; exit 1; }
            case "$COUNT" in ''|*[!0-9]*) echo "FAIL: API did not return a listings count ($COUNT)"; exit 1;; esac
            [ "$COUNT" -gt 0 ] || { echo "FAIL: 0 listings served"; exit 1; }
            echo "VERIFIED: production live on the S3 backend; $COUNT listings served from S3"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

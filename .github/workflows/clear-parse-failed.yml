name: Clear stale parse-failed scores

# Run manually only — clears cached { error: 'parse-failed' } alignment scores
# from data/documents/index.json so they get re-scored on next modal open.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clear stale scores
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          REPO_PATH: ${{ secrets.REPO_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -se <<EOF
            set -euo pipefail
            cd "$REPO_PATH"
            echo "▸ Running clear-parse-failed script..."
            node scripts/clear-parse-failed.js
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

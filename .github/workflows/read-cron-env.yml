name: Read cron env from EC2 (one-shot)

# M6-2 prep — pull the scraping-source config the cron Lambda needs from EC2's
# .env. Prints only the non-secret keys; USAJOBS_API_KEY is reported as set/empty
# (never its value). See SERVERLESS-TRANSITION.md.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read cron env keys
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          REPO_PATH: ${{ secrets.REPO_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -se <<EOF
            set -uo pipefail
            cd "$REPO_PATH"
            [ -f .env ] || { echo "FAIL: no .env at $REPO_PATH"; exit 1; }
            echo "=== non-secret scraping config (cron Lambda env) ==="
            grep -E '^(GREENHOUSE_BOARDS|LEVER_COMPANIES|USAJOBS_EMAIL)=' .env || echo "(none of those set)"
            echo "=== USAJOBS_API_KEY (value NOT printed) ==="
            if grep -qE '^USAJOBS_API_KEY=.+\$' .env; then
              echo "USAJOBS_API_KEY: SET"
            else
              echo "USAJOBS_API_KEY: empty/unset (skip it in the Lambda env)"
            fi
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

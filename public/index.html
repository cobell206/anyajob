<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7faf9">
  <title>Roles · Lawbound</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="brand">
        <span class="brand-mark">L</span>
        <span>Lawbound</span>
      </a>
      <nav>
        <a href="/" class="active">Roles</a>
        <a href="/profile.html">Profile</a>
        <a href="/paste.html">Paste JD</a>
        <a href="/settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1 class="page-title">Roles</h1>
        <div class="page-sub" id="sub">Loading…</div>
      </div>
    </div>

    <!-- Daily brief -->
    <section class="brief" id="brief" style="display:none">
      <div class="brief-meta">
        <span class="brief-eyebrow">Today's brief</span>
        <span class="brief-date" id="brief-date"></span>
      </div>
      <p class="brief-text" id="brief-text"></p>
    </section>

    <!-- Weekly reflection (collapsible) -->
    <details class="weekly" id="weekly" style="display:none">
      <summary class="weekly-summary">
        <span class="weekly-eyebrow">Weekly reflection</span>
        <span class="weekly-date" id="weekly-date"></span>
        <span class="weekly-chevron">▾</span>
      </summary>
      <div class="weekly-body" id="weekly-text"></div>
    </details>

    <div class="stats" id="stats"></div>

    <div class="filters" id="filters"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="score" class="sorted">Score</th>
            <th data-sort="title">Title</th>
            <th data-sort="company">Company</th>
            <th data-sort="location">Location</th>
            <th data-sort="salary">Salary</th>
            <th data-sort="status">Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="cards" id="cards"></div>

    <div id="empty" style="display:none">
      <div class="empty">
        <div class="empty-icon">○</div>
        <div class="empty-title">No roles yet</div>
        <div class="empty-sub">The daily scrape runs at 6am. Or paste one to get started.</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { $, $$, escapeHtml, api, fmtSalary, fmtDate, scoreClass, STATUSES } from './app.js';
    import { openModal } from './modal.js';

    let allListings = [];
    let activeStatus = 'all';
    let sortKey = 'score';
    let sortDir = 'desc';

    function getSortValue(l, key) {
      switch (key) {
        case 'score': return l.score?.overallScore ?? 0;
        case 'title': return (l.title || '').toLowerCase();
        case 'company': return (l.company || '').toLowerCase();
        case 'location': return (l.location || '').toLowerCase();
        case 'salary': return l.score?.salaryMax || l.score?.salaryMin || 0;
        case 'status': return l.status || 'new';
        default: return 0;
      }
    }

    function applyFiltersAndSort(listings) {
      let out = listings.slice();
      if (activeStatus !== 'all') {
        out = out.filter((l) => (l.status || 'new') === activeStatus);
      }
      out.sort((a, b) => {
        const av = getSortValue(a, sortKey);
        const bv = getSortValue(b, sortKey);
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      return out;
    }

    function scoreCell(l) {
      const overall = l.score?.overallScore ?? 0;
      const qual = l.score?.qualificationFit ?? 0;
      const lsv = l.score?.lawSchoolValue ?? 0;
      return `
        <div class="score-cell">
          <div class="score-num ${scoreClass(overall)}">${overall}</div>
          <div class="score-bars">
            <div class="score-bar qual"><div class="score-bar-fill" style="width:${qual * 10}%"></div></div>
            <div class="score-bar value"><div class="score-bar-fill" style="width:${lsv * 10}%"></div></div>
          </div>
        </div>
      `;
    }

    function statusBadge(status) {
      const s = status || 'new';
      const label = STATUSES.find((x) => x.value === s)?.label || s;
      return `<span class="status-badge status-${s}">${label}</span>`;
    }

    function renderTable(listings) {
      const tbody = $('#tbody');
      tbody.innerHTML = listings.map((l) => `
        <tr data-id="${escapeHtml(l.dedupKey || l.fingerprint)}">
          <td>${scoreCell(l)}</td>
          <td>
            <div class="cell-title">${escapeHtml(l.title)}</div>
            ${l.score?.workMode ? `<div class="cell-sub">${escapeHtml(l.score.workMode)}</div>` : ''}
          </td>
          <td><span class="cell-company">${escapeHtml(l.company)}</span></td>
          <td><span class="cell-location">${escapeHtml(l.location || '—')}</span></td>
          <td><span class="cell-salary">${fmtSalary(l.score?.salaryMin, l.score?.salaryMax)}</span></td>
          <td>${statusBadge(l.status)}</td>
        </tr>
      `).join('');

      $$('tr', tbody).forEach((tr) => {
        tr.addEventListener('click', () => {
          const id = tr.dataset.id;
          const listing = allListings.find((l) => (l.dedupKey || l.fingerprint) === id);
          if (listing) openModal(listing, onListingUpdated);
        });
      });

      $$('th[data-sort]').forEach((th) => {
        th.classList.remove('sorted', 'asc');
        if (th.dataset.sort === sortKey) {
          th.classList.add('sorted');
          if (sortDir === 'asc') th.classList.add('asc');
        }
      });
    }

    function renderCards(listings) {
      const cards = $('#cards');
      cards.innerHTML = listings.map((l) => {
        const overall = l.score?.overallScore ?? 0;
        return `
          <div class="card" data-id="${escapeHtml(l.dedupKey || l.fingerprint)}">
            <div class="card-row">
              <div style="flex:1;min-width:0">
                <div class="cell-title" style="margin-bottom:2px">${escapeHtml(l.title)}</div>
                <div class="cell-company">${escapeHtml(l.company)}</div>
              </div>
              <div class="score-num ${scoreClass(overall)}" style="font-size:28px">${overall}</div>
            </div>
            <div class="card-meta">
              <span>${escapeHtml(l.location || '—')}</span>
              <span>${fmtSalary(l.score?.salaryMin, l.score?.salaryMax)}</span>
              ${l.closesDate ? `<span>Closes ${fmtDate(l.closesDate)}</span>` : ''}
            </div>
            <div class="card-foot">
              ${statusBadge(l.status)}
              ${l.rating === 'up' ? '<span style="color:var(--green)">👍</span>' :
                l.rating === 'down' ? '<span style="color:var(--bad)">👎</span>' : ''}
            </div>
          </div>
        `;
      }).join('');

      $$('.card', cards).forEach((card) => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          const listing = allListings.find((l) => (l.dedupKey || l.fingerprint) === id);
          if (listing) openModal(listing, onListingUpdated);
        });
      });
    }

    function render() {
      const filtered = applyFiltersAndSort(allListings);
      const empty = $('#empty');
      const tableWrap = $('.table-wrap');
      const cards = $('#cards');

      if (filtered.length === 0) {
        empty.style.display = 'block';
        tableWrap.style.display = 'none';
        cards.style.display = 'none';
      } else {
        empty.style.display = 'none';
        tableWrap.style.display = '';
        cards.style.display = '';
        renderTable(filtered);
        renderCards(filtered);
      }
      $('#sub').textContent = `${filtered.length} of ${allListings.length} listings`;
    }

    function onListingUpdated(updated) {
      const updatedKey = updated.dedupKey || updated.fingerprint;
      const idx = allListings.findIndex((l) => (l.dedupKey || l.fingerprint) === updatedKey);
      if (idx >= 0) allListings[idx] = { ...allListings[idx], ...updated };
      render();
      loadStats();
    }

    const FILTER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>';
    const CHEVRON_ICON = '<svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

    function closeFilterPopup() {
      const popup = $('#filter-popup');
      const trigger = $('#filter-trigger');
      if (!popup || !trigger) return;
      popup.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
    }

    function openFilterPopup() {
      const popup = $('#filter-popup');
      const trigger = $('#filter-trigger');
      if (!popup || !trigger) return;
      popup.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
    }

    function renderFilters(stats) {
      const counts = stats.byStatus || {};
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      const options = [
        { value: 'all', label: 'All', count: total },
        ...STATUSES.map((s) => ({ ...s, count: counts[s.value] || 0 })),
      ];
      const active = options.find((o) => o.value === activeStatus) || options[0];
      const isFiltered = activeStatus !== 'all';

      $('#filters').innerHTML = `
        <div class="filter-trigger-wrap">
          <button type="button" class="filter-trigger ${isFiltered ? 'is-active' : ''}"
                  id="filter-trigger" aria-haspopup="listbox" aria-expanded="false">
            ${FILTER_ICON}
            <span class="filter-trigger-label">${active.label}</span>
            <span class="filter-trigger-count">${active.count}</span>
            ${CHEVRON_ICON}
          </button>
          <div class="filter-popup" id="filter-popup" role="listbox" hidden>
            ${options.map((o) => `
              <button type="button" role="option"
                      class="filter-option ${o.value === activeStatus ? 'active' : ''}"
                      aria-selected="${o.value === activeStatus}"
                      data-filter="${o.value}">
                <span class="filter-option-label">${o.label}</span>
                <span class="filter-option-count">${o.count}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      $('#filter-trigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const popup = $('#filter-popup');
        if (popup.hidden) openFilterPopup(); else closeFilterPopup();
      });

      $$('.filter-option').forEach((opt) => {
        opt.addEventListener('click', () => {
          activeStatus = opt.dataset.filter;
          closeFilterPopup();
          render();
          renderFilters(stats);
        });
      });
    }

    document.addEventListener('click', (e) => {
      const wrap = e.target.closest('.filter-trigger-wrap');
      if (!wrap) closeFilterPopup();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFilterPopup();
    });

    function renderStats(stats) {
      $('#stats').innerHTML = `
        <div class="stat">
          <div class="stat-label">Total roles</div>
          <div class="stat-value">${stats.total}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Saved</div>
          <div class="stat-value accent">${stats.byStatus.saved || 0}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Applied</div>
          <div class="stat-value good">${stats.byStatus.applied || 0}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Applied this week</div>
          <div class="stat-value">${stats.appliedThisWeek}</div>
        </div>
      `;
    }

    function fmtBriefDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    function renderSummaries(s) {
      if (s.daily?.text) {
        $('#brief').style.display = 'block';
        $('#brief-date').textContent = fmtBriefDate(s.daily.date);
        $('#brief-text').textContent = s.daily.text;
      }
      if (s.weekly?.text) {
        $('#weekly').style.display = 'block';
        $('#weekly-date').textContent = s.weekly.weekRange || '';
        // Render simple markdown (** **) inline
        const html = escapeHtml(s.weekly.text)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        $('#weekly-text').innerHTML = `<p>${html}</p>`;
      }
    }

    async function loadStats() {
      const stats = await api('/api/stats');
      renderStats(stats);
      renderFilters(stats);
    }

    async function loadSummaries() {
      try {
        const s = await api('/api/summaries');
        renderSummaries(s);
      } catch (err) {
        console.warn('No summaries yet', err);
      }
    }

    async function load() {
      const data = await api('/api/listings?days=60');
      allListings = data.listings;
      await Promise.all([loadStats(), loadSummaries()]);
      render();
    }

    $$('th[data-sort]').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = key === 'score' || key === 'salary' ? 'desc' : 'asc';
        }
        render();
      });
    });

    load();
  </script>

      <a href="/" class="active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Roles</span>
      </a>
      <a href="/profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
      <a href="/paste.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        <span>Paste</span>
      </a>
      <a href="/notifications.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span>Notify</span>
      </a>
      <a href="/settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </div>
  </nav>
</body>
</html>

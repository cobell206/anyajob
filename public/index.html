<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafaf7">
  <script>(function(){function a(t){document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#1a1614':'#fafaf7';}function r(){var s=localStorage.getItem('theme')||'auto';return s==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;}try{a(r());}catch(e){}try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if((localStorage.getItem('theme')||'auto')==='auto')a(r());});}catch(e){}})();</script>
  <title>Roles · AnyaJob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css?v=__CACHE_VERSION__">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>
<body>
  <!-- nav:header -->

  <main>
    <div class="page-head">
      <div>
        <h1 class="page-title">Roles</h1>
        <div class="page-sub" id="sub">Loading…</div>
      </div>
      <div class="page-head-actions">
        <button type="button" class="pending-review-pill" id="pending-review-pill" hidden aria-label="Review pending source candidates">
          Review <span class="pending-review-count" id="pending-review-count">0</span>
        </button>
        <a href="/ignored.html" class="ignored-link" id="ignored-link" hidden>
          Ignored <span class="ignored-link-count" id="ignored-link-count"></span> →
        </a>
        <button type="button" class="btn primary" id="add-role-btn">+ Add role</button>
      </div>
    </div>

    <!-- Daily brief -->
    <section class="brief" id="brief" style="display:none">
      <div class="brief-meta">
        <span class="brief-eyebrow">Today's brief</span>
        <span class="brief-date" id="brief-date"></span>
      </div>
      <p class="brief-text" id="brief-text"></p>
    </section>

    <!-- Weekly reflection (collapsible) -->
    <details class="weekly" id="weekly" style="display:none">
      <summary class="weekly-summary">
        <span class="weekly-eyebrow">Weekly reflection</span>
        <span class="weekly-date" id="weekly-date"></span>
        <span class="weekly-chevron">▾</span>
      </summary>
      <div class="weekly-body" id="weekly-text"></div>
    </details>

    <div class="stats" id="stats"></div>

    <div class="table-toolbar">
      <div class="table-toolbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="t-search" placeholder="Search title, company, or location" autocomplete="off">
      </div>
      <div class="filters" id="filters"></div>
      <div class="view-toggle">
        <button class="view-btn is-active" id="view-table" title="Table view">≡</button>
        <button class="view-btn" id="view-kanban" title="Kanban view">⊞</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="score" class="sorted">Score</th>
            <th data-sort="title">Title</th>
            <th data-sort="company">Company</th>
            <th data-sort="location">Location</th>
            <th data-sort="salary">Salary</th>
            <th data-sort="status">Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="cards" id="cards"></div>

    <div id="kanban-board" hidden></div>

    <div id="empty" style="display:none">
      <div class="empty">
        <div class="empty-icon">○</div>
        <div class="empty-title">No roles yet</div>
        <div class="empty-sub">The daily scrape runs at 6am, or add one now.</div>
        <button type="button" class="btn primary" id="add-role-btn-empty" style="margin-top:14px">+ Add a role</button>
      </div>
    </div>
  </main>

  <script type="module" src="/roles.js?v=__CACHE_VERSION__"></script>

  <!-- nav:tab-bar -->
</body>
</html>

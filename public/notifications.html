<!DOCTYPE html>
<html lang="en" data-color-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>Notifications · Job Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css?v=__CACHE_VERSION__">
</head>
<body>
  <!-- nav:header -->

  <main style="max-width:860px;margin:0 auto;padding:24px 20px 80px">
    <h1 class="page-title">Email previews</h1>
    <p class="page-sub" style="margin-bottom:20px">See exactly what each notification looks like before it sends. Use the test button to send a real one to yourself.</p>

    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      <button class="filter-pill active" data-kind="morning">Morning · standard</button>
      <button class="filter-pill" data-kind="urgent">Morning · with closing soon</button>
      <button class="filter-pill" data-kind="weekly">Weekly digest</button>
    </div>

    <div style="background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-xs);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:600">Subject</div>
        <div id="subject" style="font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-0.02em;margin-top:2px">Loading…</div>
      </div>
      <div style="display:flex;gap:8px">
        <input type="email" id="test-to" placeholder="leave blank to use saved recipients" style="font-size:13px;padding:9px 12px;width:280px;background:white">
        <button class="btn primary" id="send-test">Send test</button>
      </div>
    </div>

    <div style="background:white;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)">
      <iframe id="preview-iframe" style="width:100%;height:720px;border:0;background:#f7faf9"></iframe>
    </div>

    <div id="status-msg" style="margin-top:14px;font-size:13px"></div>

    <div style="margin-top:32px">
      <h2 style="font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px">Recently sent</h2>
      <div id="log" style="background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px;box-shadow:var(--shadow-xs)"></div>
    </div>
  </main>

  <script type="module">
    import { $, $$, escapeHtml, api } from './app.js?v=__CACHE_VERSION__';

    let activeKind = 'morning';

    async function loadPreview() {
      const data = await api(`/api/notify/preview/${activeKind}`);
      $('#subject').textContent = data.subject;
      const iframe = $('#preview-iframe');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(data.html);
      doc.close();
    }

    async function loadLog() {
      const log = await api('/api/notify/log');
      const recent = (log.sent || []).slice(-10).reverse();
      if (recent.length === 0) {
        $('#log').innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No emails sent yet.</div>';
        return;
      }
      $('#log').innerHTML = recent.map(e => `
        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:13px">
          <div>
            <div style="font-weight:500">${escapeHtml(e.subject)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${e.kind} · ${new Date(e.sentAt).toLocaleString()}</div>
          </div>
          <span class="status-badge status-applied">sent</span>
        </div>
      `).join('').replace(/border-bottom:1px solid var\(--border\);(?=[^]*$)/, '');
    }

    $$('[data-kind]').forEach(b => {
      b.addEventListener('click', () => {
        activeKind = b.dataset.kind;
        $$('[data-kind]').forEach(x => x.classList.toggle('active', x === b));
        loadPreview();
      });
    });

    $('#send-test').addEventListener('click', async () => {
      const to = $('#test-to').value.trim();
      const status = $('#status-msg');
      const btn = $('#send-test');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner sm on-primary"></span> Sending…';
      try {
        const res = await fetch('/api/notify/send-test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kind: activeKind, to: to || undefined }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        status.textContent = '✓ Sent (' + data.messageId + ')';
        status.style.color = 'var(--green-ink)';
        loadLog();
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        status.style.color = 'var(--bad)';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send test';
      }
    });

    loadPreview();
    loadLog();
  </script>

  <!-- nav:tab-bar -->
</body>
</html>

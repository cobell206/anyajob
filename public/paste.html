<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7faf9">
  <script>(function(){function a(t){document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#0b1220':'#f7faf9';}function r(){var s=localStorage.getItem('theme')||'auto';return s==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;}try{a(r());}catch(e){}try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if((localStorage.getItem('theme')||'auto')==='auto')a(r());});}catch(e){}})();</script>
  <title>Add a role · Job Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css?v=__CACHE_VERSION__">
</head>
<body>
  <!-- nav:header -->

  <main style="max-width: 720px; margin: 0 auto">
    <div class="page-head">
      <div>
        <h1 class="page-title">Add a role</h1>
        <div class="page-sub">Paste a JD from LinkedIn, Indeed, anywhere — score it, or log one you've already applied to.</div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);max-width:680px">
      <label>Job URL</label>
      <div style="display:flex;gap:8px;align-items:stretch">
        <input type="url" id="url" placeholder="https://…  (paste a link to auto-fill the fields below)" style="flex:1;margin:0">
        <button type="button" class="btn" id="fetchFromUrl" style="white-space:nowrap;margin:0">Auto-fill</button>
      </div>
      <p id="fetchStatus" style="margin:6px 0 0;font-size:12px;color:var(--muted);min-height:16px"></p>

      <label style="margin-top:18px">Title</label>
      <input type="text" id="title" placeholder="e.g. Litigation Paralegal">

      <div class="field-grid">
        <div>
          <label>Company</label>
          <input type="text" id="company" placeholder="e.g. Davis Polk">
        </div>
        <div>
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g. New York, NY">
        </div>
      </div>

      <label>Description</label>
      <textarea id="description" rows="10" placeholder="Paste the full job description here…"></textarea>

      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;font-weight:500;cursor:pointer;text-transform:none;letter-spacing:normal;color:var(--ink);font-size:14px">
        <input type="checkbox" id="alreadyApplied" style="width:auto;margin:0">
        I've already applied to this
      </label>

      <div id="appliedFields" hidden style="margin-top:12px;padding:16px;background:var(--surface-2,#f7f9fc);border:1px solid var(--border);border-radius:var(--radius-md,8px)">
        <div class="field-grid">
          <div>
            <label>Outcome</label>
            <select id="appStatus">
              <option value="applied">Applied — waiting</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div>
            <label>When</label>
            <input type="date" id="appDate">
          </div>
        </div>
        <label>Notes (optional)</label>
        <textarea id="appNote" rows="3" placeholder="Anything worth remembering — referral source, OA date, contact name…"></textarea>
        <p style="margin:8px 0 0;font-size:12px;color:var(--muted)">This will count as a positive example when scoring future listings and discovering new sources.</p>
      </div>

      <button class="btn primary" id="submit" style="width:100%; padding:12px; font-size:15px; margin-top:16px; justify-content:center">Score it</button>
    </div>

    <div id="result"></div>
  </main>

  <script type="module">
    import { $, escapeHtml, fmtSalary, scoreClass } from './app.js?v=__CACHE_VERSION__';

    const btn = $('#submit');
    const result = $('#result');
    const alreadyApplied = $('#alreadyApplied');
    const appliedFields = $('#appliedFields');
    const appDate = $('#appDate');
    const urlInput = $('#url');
    const fetchBtn = $('#fetchFromUrl');
    const fetchStatus = $('#fetchStatus');

    appDate.value = new Date().toISOString().slice(0, 10);

    function syncAppliedToggle() {
      const on = alreadyApplied.checked;
      appliedFields.hidden = !on;
      btn.textContent = on ? 'Log it' : 'Score it';
    }
    alreadyApplied.addEventListener('change', syncAppliedToggle);
    syncAppliedToggle();

    function setFetchStatus(text, kind = 'muted') {
      fetchStatus.textContent = text;
      fetchStatus.style.color = kind === 'good' ? 'var(--green-ink)'
        : kind === 'bad' ? 'var(--bad)'
        : 'var(--muted)';
    }

    async function autoFillFromUrl() {
      const url = urlInput.value.trim();
      if (!url) {
        setFetchStatus('Paste a URL above first.', 'bad');
        return;
      }
      try { new URL(url); } catch {
        setFetchStatus("That doesn't look like a valid URL.", 'bad');
        return;
      }
      fetchBtn.disabled = true;
      const orig = fetchBtn.textContent;
      fetchBtn.innerHTML = '<span class="spinner sm"></span> Fetching…';
      setFetchStatus('Fetching the page and extracting fields…');
      try {
        const res = await fetch('/api/score-paste/extract-from-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!data.extracted) {
          setFetchStatus(`Couldn't extract — ${data.reason || 'unknown reason'}. Fill in the fields manually below.`, 'bad');
          return;
        }
        // Prefill non-empty fields. Don't clobber anything she's already typed.
        if (data.title && !$('#title').value) $('#title').value = data.title;
        if (data.company && !$('#company').value) $('#company').value = data.company;
        if (data.location && !$('#location').value) $('#location').value = data.location;
        if (data.description && !$('#description').value) $('#description').value = data.description;
        setFetchStatus('Filled in from URL — please verify and edit before submitting.', 'good');
      } catch (err) {
        setFetchStatus(`Couldn't reach that page (${err.message}). Fill in manually.`, 'bad');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = orig;
      }
    }

    fetchBtn.addEventListener('click', autoFillFromUrl);
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); autoFillFromUrl(); }
    });

    btn.addEventListener('click', async () => {
      const body = {
        title: $('#title').value.trim(),
        company: $('#company').value.trim(),
        location: $('#location').value.trim(),
        url: $('#url').value.trim(),
        description: $('#description').value.trim(),
      };
      if (alreadyApplied.checked) {
        body.alreadyApplied = true;
        body.applicationStatus = $('#appStatus').value;
        body.appliedDate = appDate.value || null;
        body.applicationNote = $('#appNote').value.trim();
      }
      if (!body.title || !body.description) {
        alert('Title and description are required.');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner sm on-primary"></span> Scoring…';
      try {
        const res = await fetch('/api/score-paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const s = data.score;
        const scoreBlock = s ? `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px">
              <div>
                <div class="cell-title" style="font-size:18px">${escapeHtml(body.title)}</div>
                <div class="cell-company">${escapeHtml(body.company)}</div>
              </div>
              <div class="score-num ${scoreClass(s.overallScore)}" style="font-size:36px">${s.overallScore}</div>
            </div>
            <div class="rationale-box">${escapeHtml(s.rationale || '')}</div>
            <div class="modal-grid" style="margin-top:16px">
              <div class="modal-stat">
                <div class="modal-stat-label">Qualification fit</div>
                <div class="modal-stat-value">${s.qualificationFit}/10</div>
              </div>
              <div class="modal-stat">
                <div class="modal-stat-label">Law school value</div>
                <div class="modal-stat-value">${s.lawSchoolValue}/10</div>
              </div>
              <div class="modal-stat">
                <div class="modal-stat-label">Salary</div>
                <div class="modal-stat-value">${fmtSalary(s.salaryMin, s.salaryMax)}</div>
              </div>
              <div class="modal-stat">
                <div class="modal-stat-label">Closes</div>
                <div class="modal-stat-value">${s.closesDate || '—'}</div>
              </div>
            </div>
            ${s.strengths?.length ? `
              <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:20px 0 8px">Strengths</h3>
              <ul class="bullet-list">${s.strengths.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
            ` : ''}
            ${s.concerns?.length ? `
              <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:20px 0 8px">Concerns</h3>
              <ul class="bullet-list concerns">${s.concerns.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
            ` : ''}
            ${s.applicationAngle ? `
              <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:20px 0 8px">Personal statement angle</h3>
              <p style="font-size:14px; color: var(--ink-2)">${escapeHtml(s.applicationAngle)}</p>
            ` : ''}` : `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px">
              <div>
                <div class="cell-title" style="font-size:18px">${escapeHtml(body.title)}</div>
                <div class="cell-company">${escapeHtml(body.company)}</div>
              </div>
            </div>
            ${data.scoreError ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 0">Saved without a score (${escapeHtml(data.scoreError)}).</p>` : ''}`;
        result.innerHTML = `
          <div class="result-card">
            ${scoreBlock}
            <p style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)">${body.alreadyApplied
              ? `Logged as <strong>${escapeHtml(body.applicationStatus)}</strong>${body.appliedDate ? ` on ${escapeHtml(body.appliedDate)}` : ''} — feeding your scoring &amp; discovery calibration.`
              : 'Saved — appears in your roles list.'}</p>
            <div style="margin-top:12px">
              <a class="btn primary" href="/">View all roles →</a>
            </div>
          </div>
        `;
      } catch (err) {
        result.innerHTML = `<div class="result-card"><p style="color:var(--bad)">Error: ${err.message}</p></div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Score it';
      }
    });
  </script>

  <!-- nav:tab-bar -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paste a JD · Job Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css?v=__CACHE_VERSION__">
</head>
<body>
  <!-- nav:header -->

  <main style="max-width: 720px; margin: 0 auto">
    <div class="page-head">
      <div>
        <h1 class="page-title">Score a listing</h1>
        <div class="page-sub">Found something on LinkedIn or Indeed? Paste it here for the same scoring.</div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);max-width:680px">
      <label>Title</label>
      <input type="text" id="title" placeholder="e.g. Litigation Paralegal">

      <div class="field-grid">
        <div>
          <label>Company</label>
          <input type="text" id="company" placeholder="e.g. Davis Polk">
        </div>
        <div>
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g. New York, NY">
        </div>
      </div>

      <label>URL (optional)</label>
      <input type="url" id="url" placeholder="https://…">

      <label>Description</label>
      <textarea id="description" rows="10" placeholder="Paste the full job description here…"></textarea>

      <button class="btn primary" id="submit" style="width:100%; padding:12px; font-size:15px; margin-top:16px; justify-content:center">Score it</button>
    </div>

    <div id="result"></div>
  </main>

  <script type="module">
    import { $, escapeHtml, fmtSalary, scoreClass } from './app.js?v=__CACHE_VERSION__';

    const btn = $('#submit');
    const result = $('#result');

    btn.addEventListener('click', async () => {
      const body = {
        title: $('#title').value.trim(),
        company: $('#company').value.trim(),
        location: $('#location').value.trim(),
        url: $('#url').value.trim(),
        description: $('#description').value.trim(),
      };
      if (!body.title || !body.description) {
        alert('Title and description are required.');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner sm on-primary"></span> Scoring…';
      try {
        const res = await fetch('/api/score-paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const s = data.score;
        result.innerHTML = `
          <div class="result-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px">
              <div>
                <div class="cell-title" style="font-size:18px">${escapeHtml(body.title)}</div>
                <div class="cell-company">${escapeHtml(body.company)}</div>
              </div>
              <div class="score-num ${scoreClass(s.overallScore)}" style="font-size:36px">${s.overallScore}</div>
            </div>
            <div class="rationale-box">${escapeHtml(s.rationale || '')}</div>
            <div class="modal-grid" style="margin-top:16px">
              <div class="modal-stat">
                <div class="modal-stat-label">Qualification fit</div>
                <div class="modal-stat-value">${s.qualificationFit}/10</div>
              </div>
              <div class="modal-stat">
                <div class="modal-stat-label">Law school value</div>
                <div class="modal-stat-value">${s.lawSchoolValue}/10</div>
              </div>
              <div class="modal-stat">
                <div class="modal-stat-label">Salary</div>
                <div class="modal-stat-value">${fmtSalary(s.salaryMin, s.salaryMax)}</div>
              </div>
              <div class="modal-stat">
                <div class="modal-stat-label">Closes</div>
                <div class="modal-stat-value">${s.closesDate || '—'}</div>
              </div>
            </div>
            ${s.strengths?.length ? `
              <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:20px 0 8px">Strengths</h3>
              <ul class="bullet-list">${s.strengths.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
            ` : ''}
            ${s.concerns?.length ? `
              <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:20px 0 8px">Concerns</h3>
              <ul class="bullet-list concerns">${s.concerns.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
            ` : ''}
            ${s.applicationAngle ? `
              <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:20px 0 8px">Personal statement angle</h3>
              <p style="font-size:14px; color: var(--ink-2)">${escapeHtml(s.applicationAngle)}</p>
            ` : ''}
            <p style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)">Saved — appears in your roles list.</p>
            <div style="margin-top:12px">
              <a class="btn primary" href="/">View all roles →</a>
            </div>
          </div>
        `;
      } catch (err) {
        result.innerHTML = `<div class="result-card"><p style="color:var(--bad)">Error: ${err.message}</p></div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Score it';
      }
    });
  </script>

  <!-- nav:tab-bar -->
</body>
</html>
